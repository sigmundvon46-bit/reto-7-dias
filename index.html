<head>

<title>Reto de 7 días · Fortaleza Inquebrantable</title>
<style>
:root{--bg:#eeeaf6;--panel:#faf8ff;--ink:#1d1840;--mute:#5b5680;--gold:#8a6420;--line:#cfc8e6;--off:#b3acd2;--btn:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f2b;--panel:#1b1740;--ink:#ece8f8;--mute:#a9a3cf;--gold:#e0bd74;--line:#352f6b;--off:#4a4486;--btn:#120f2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120f2b;--panel:#1b1740;--ink:#ece8f8;--mute:#a9a3cf;--gold:#e0bd74;--line:#352f6b;--off:#4a4486;--btn:#120f2b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:28px 20px 48px}
[hidden]{display:none!important}
header{text-align:center}
.player{display:block;width:100%;margin:10px 0 4px}
.hint{color:var(--mute);font-size:.95rem;margin-top:14px!important}
.logo{display:block;width:100%;height:auto;border-radius:14px;margin:0 0 18px}
h1{font-size:2.1rem;line-height:1.2;margin:.3em 0 .2em;font-weight:normal}
.lead{color:var(--mute);margin:0}
.stars{display:flex;justify-content:space-between;position:relative;margin:32px 0 24px}
.stars::before{content:"";position:absolute;top:20px;left:19px;right:19px;height:1px;background:var(--line)}
.star{position:relative;z-index:1;width:38px;background:var(--bg);border:0;padding:0;font:inherit;color:var(--off);cursor:pointer;display:flex;flex-direction:column;align-items:center}
.star .g{font-size:28px;line-height:1.3}
.star small{font-size:.8rem;color:var(--mute)}
.star.done,.star.now{color:var(--gold)}
.star.now .g{text-shadow:0 0 14px var(--gold)}
.star[aria-current="true"] small{color:var(--ink);font-weight:bold}
.star:disabled{cursor:default}
.star:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.pillar{color:var(--gold);font-style:italic;margin:0}
h2{font-size:1.6rem;line-height:1.3;font-weight:normal;margin:.2em 0 .6em}
h3{font-size:1.05rem;color:var(--gold);margin:1.4em 0 .2em;font-weight:bold}
.card p{margin:.3em 0}
.q{font-style:italic;font-size:1.08rem}
textarea{width:100%;min-height:130px;margin-top:10px;padding:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:inherit;line-height:1.6;resize:vertical}
.row{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--gold);color:var(--btn);border:0;border-radius:999px;padding:12px 22px;font:inherit;font-weight:bold;cursor:pointer}
.btn.quiet{background:none;color:var(--mute);border:1px solid var(--line);font-weight:normal}
#msg{color:var(--mute);font-size:.95rem}
#end{margin-top:20px;text-align:center}
footer{text-align:center;color:var(--mute);font-size:.85rem;margin-top:28px}
</style>
</head>

<h1>Reto de 7 días</h1>
<p class="lead">Siete días para volver a tu centro.</p>
</header>
<nav class="stars" id="stars" aria-label="Días del reto"></nav>
<section class="card" id="day"></section>
<section class="card" id="end" hidden>
<h2>Completaste el reto ✦</h2>
<p>Tu espíritu ya sabe cómo sostenerse. Vuelve a leer tu diario cuando necesites recordar de qué estás hecho.</p>
<div class="row" style="justify-content:center"><button class="btn quiet" id="reset">Reiniciar reto</button></div>
</section>
<footer>Tu diario se guarda solo en este dispositivo.</footer>
</main>
<script>
const DAYS=[
{p:"Dolor y adversidad",t:"Lo que duele también forma",r:"El dolor no es señal de que algo falló en ti. Es el material con el que tu espíritu se fortalece. Hoy no vas a resolverlo ni a borrarlo: solo vas a mirarlo de frente, sin juicio.",a:"Siéntate en silencio diez minutos. Trae a la mente una dificultad que cargas y nómbrala en voz baja: «esto me duele». Respira y quédate con ella sin intentar cambiarla.",q:"¿Qué dolor llevo cargando que todavía no me he permitido mirar de frente?"},
{p:"Guerra interior",t:"La batalla que nadie ve",r:"Casi toda tu guerra ocurre dentro: una voz que duda, que compara, que te frena. No es un enemigo externo, sino una parte de ti que aprendió a protegerte con miedo.",a:"Durante el día, cada vez que notes esa voz, anótala con una palabra. Al final de la jornada dale un nombre y léelo en voz alta.",q:"¿Qué me dice esa voz cuando intento avanzar, y de qué intenta protegerme?"},
{p:"Identidad espiritual",t:"Quién eres sin lo que tienes",r:"Tus títulos, tu historia y tus pérdidas son circunstancias. Debajo de todo eso existe algo que no se rompe con lo que te pasa: tu espíritu.",a:"Escribe cinco cualidades que seguirían en ti aunque lo perdieras todo. Después respira tres minutos llevando la atención al pecho.",q:"Si me quitaran todo lo externo, ¿qué seguiría siendo verdad de mí?"},
{p:"Fe interior",t:"Confiar antes de ver",r:"La fe interior no es esperar un milagro: es decidir avanzar aunque no haya garantías. Se entrena con actos pequeños.",a:"Elige una acción que has postergado por miedo y hazla hoy sin esperar resultados. Al terminar, agradécete por haberte atrevido.",q:"¿Qué paso estoy postergando por falta de certeza, y qué pasaría si lo diera hoy?"},
{p:"Sombra y proyección",t:"Lo que te molesta de otros",r:"Lo que más te irrita en los demás suele señalar una parte tuya que aún no aceptas. Esa parte oculta es tu sombra, y se vuelve una fuente de fuerza cuando la reconoces.",a:"Recuerda a alguien que te molestó esta semana. Escribe qué rasgo te irritó y en qué momentos tú actúas así, o te lo prohíbes.",q:"¿Qué parte de mí estoy viendo reflejada en esa persona?"},
{p:"Ciclos y patrones",t:"Lo que se repite te está enseñando",r:"Las situaciones que regresan una y otra vez no son mala suerte: son lecciones sin resolver. Cuando ves el patrón, dejas de repetirlo.",a:"Recuerda tres momentos difíciles que se parezcan entre sí. Anota qué tienen en común: la emoción, la decisión, la persona o tu reacción.",q:"¿Qué patrón se repite en mi vida y qué decisión distinta podría tomar la próxima vez?"},
{p:"Transformación",t:"Elegir quién vas a ser",r:"Transformarte no es convertirte en otra persona, sino dejar caer lo que ya no te representa. Llegaste hasta aquí, y eso ya es una señal de tu fortaleza.",a:"Escribe una declaración de cinco líneas sobre quién eliges ser desde hoy. Léela en voz alta y guárdala donde puedas volver a ella.",q:"¿Qué dejo atrás y qué decido sostener desde hoy?"}
];
const K="fi_reto7",$=id=>document.getElementById(id);
const fresh=()=>({done:Array(7).fill(false),notes:Array(7).fill("")});
const AUDIO=["audio/practica1.mp3","audio/practica2.mp3","audio/practica3.mp3","audio/practica4.mp3","audio/practica5.mp3","audio/practica6.mp3","audio/practica7.mp3"];
let S=fresh(),sel=0,armed=false;
try{const o=JSON.parse(localStorage.getItem(K)||"null");if(o&&Array.isArray(o.done)&&o.done.length===7&&Array.isArray(o.notes)&&o.notes.length===7)S=o}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const cur=()=>{const i=S.done.indexOf(false);return i<0?7:i};
sel=Math.min(cur(),6);
function render(){
const c=cur();
$("stars").innerHTML=DAYS.map((d,i)=>{
const st=S.done[i]?"done":i===c?"now":"off",lock=i>c;
return `<button class="star ${st}" data-i="${i}" ${lock?"disabled":""} ${i===sel?'aria-current="true"':""} aria-label="Día ${i+1}${S.done[i]?", completado":lock?", bloqueado":""}"><span class="g">✦</span><small>${i+1}</small></button>`}).join("");
const d=DAYS[sel];
const au=AUDIO[sel]?`<p class="hint">Escucha la práctica guiada:</p><audio class="player" controls preload="none" src="${AUDIO[sel]}"></audio>`:"";
$("day").innerHTML=`<p class="pillar">Día ${sel+1}: ${d.p}</p><h2>${d.t}</h2><h3>Reflexión</h3><p>${d.r}</p><h3>Práctica</h3><p>${d.a}</p>${au}<h3>Tu diario</h3><p class="q">${d.q}</p><textarea id="note" aria-label="Tu respuesta" placeholder="Escribe aquí. Solo tú puedes ver esto."></textarea><div class="row"><button class="btn" id="go">${S.done[sel]?"Guardar cambios":"Completar día"}</button><span id="msg" role="status"></span></div>`;
$("note").value=S.notes[sel]||"";
$("end").hidden=c<7;
}
document.addEventListener("click",e=>{
const s=e.target.closest(".star");
if(s&&!s.disabled){sel=+s.dataset.i;render();return}
if(e.target.id==="go"){
S.notes[sel]=$("note").value;const was=S.done[sel];S.done[sel]=true;save();
if(!was&&sel<6){sel=cur();render();window.scrollTo(0,0)}
else{render();$("msg").textContent=cur()===7?"Reto completado ✦":"Guardado."}
return}
if(e.target.id==="reset"){
if(!armed){armed=true;e.target.textContent="Confirmar: se borrará tu diario";return}
